name: ForgeViz extraction bootstrap

on:
  push:
    branches: [extract-v1.2-engine]

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extraction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
          run_install: false

      - name: Materialize exact V1.2 engine source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT='7aaa8fa601c5fa2c9f8acfd7a4d4eb54b887b9ef'
          rm -rf /tmp/viz-source
          git clone --filter=blob:none --no-checkout https://github.com/julian-passebecq/Fluent2_J_Viz.git /tmp/viz-source
          git -C /tmp/viz-source checkout "$SOURCE_COMMIT" -- src/core src/renderers src/adapters src/index.ts
          rm -rf src/core src/renderers src/adapters src/index.ts
          mkdir -p src
          cp -R /tmp/viz-source/src/core src/core
          cp -R /tmp/viz-source/src/renderers src/renderers
          cp -R /tmp/viz-source/src/adapters src/adapters
          cp /tmp/viz-source/src/index.ts src/index.ts
          printf '%s\n' "$SOURCE_COMMIT" > SOURCE_COMMIT

      - name: Write standalone package boundary
        shell: bash
        run: |
          cat > package.json <<'JSON'
          {
            "name": "@vizforge/engine",
            "version": "1.2.0",
            "private": true,
            "type": "module",
            "description": "Framework-independent semantic D3 analytical figures and deterministic editorial stories",
            "exports": {
              ".": {"types": "./dist/index.d.ts", "import": "./dist/index.js"},
              "./react": {"types": "./dist/adapters/react.d.ts", "import": "./dist/adapters/react.js"}
            },
            "files": ["dist", "README.md", "SOURCE_COMMIT"],
            "scripts": {
              "typecheck": "tsc --noEmit",
              "test": "vitest run",
              "build": "tsc -p tsconfig.lib.json",
              "check": "pnpm typecheck && pnpm test && pnpm build && pnpm pack:smoke",
              "pack:smoke": "node scripts/pack-smoke.mjs"
            },
            "engines": {"node": ">=22.13.0"},
            "dependencies": {
              "d3": "7.9.0",
              "d3-sankey": "0.12.3",
              "zod": "3.24.2"
            },
            "peerDependencies": {
              "react": ">=18.3 <20",
              "react-dom": ">=18.3 <20"
            },
            "peerDependenciesMeta": {
              "react": {"optional": true},
              "react-dom": {"optional": true}
            },
            "devDependencies": {
              "@types/d3": "7.4.3",
              "@types/d3-sankey": "0.12.4",
              "@types/node": "22.13.10",
              "@types/react": "19.2.18",
              "@types/react-dom": "19.2.7",
              "jsdom": "26.0.0",
              "react": "19.2.8",
              "react-dom": "19.2.8",
              "typescript": "7.0.2",
              "vitest": "3.2.7"
            },
            "packageManager": "pnpm@11.19.0",
            "pnpm": {"onlyBuiltDependencies": ["esbuild"]}
          }
          JSON

          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["ES2022", "DOM", "DOM.Iterable"],
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "jsx": "react-jsx",
              "strict": true,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "resolveJsonModule": true,
              "allowImportingTsExtensions": true,
              "noEmit": true,
              "types": ["node"]
            },
            "include": ["src", "tests", "vitest.config.ts"]
          }
          JSON

          cat > tsconfig.lib.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "noUnusedLocals": true,
              "noUnusedParameters": true,
              "noEmit": false,
              "allowImportingTsExtensions": false,
              "outDir": "dist",
              "rootDir": "src",
              "declaration": true,
              "declarationMap": true,
              "sourceMap": true
            },
            "include": ["src/index.ts", "src/core", "src/renderers", "src/adapters"],
            "exclude": ["tests"]
          }
          JSON

          cat > vitest.config.ts <<'TS'
          import { defineConfig } from 'vitest/config';
          export default defineConfig({
            test: {
              environment: 'jsdom',
              include: ['tests/**/*.test.ts'],
              restoreMocks: true
            }
          });
          TS

      - name: Write independent smoke tests
        shell: bash
        run: |
          mkdir -p tests scripts
          cat > tests/standalone.test.ts <<'TS'
          import { describe, expect, it } from 'vitest';
          import { readFileSync, readdirSync } from 'node:fs';
          import { dirname, resolve, sep } from 'node:path';
          import { createRenderer, parseStory, parseVisualization, StoryPlayer } from '../src/index.js';

          const ranking = parseVisualization({
            id: 'smoke-ranking',
            version: '1.0',
            type: 'ranking',
            title: 'Smoke ranking',
            takeaway: 'A deterministic standalone figure.',
            source: 'Synthetic test fixture',
            note: 'No external data.',
            accessibility: { summary: 'Two entities ranked at two times.' },
            encodings: { id: 'id', label: 'label', time: 'year', value: 'value' },
            data: [
              { id: 'a', label: 'Alpha', year: 2025, value: 10 },
              { id: 'b', label: 'Beta', year: 2025, value: 8 },
              { id: 'a', label: 'Alpha', year: 2026, value: 9 },
              { id: 'b', label: 'Beta', year: 2026, value: 11 }
            ]
          });

          describe('standalone ForgeViz package boundary', () => {
            it('parses, plays and renders without Datapass', () => {
              const story = parseStory({
                id: 'smoke-story',
                version: '1.0',
                title: 'Smoke story',
                description: 'Two deterministic scenes.',
                intervalMs: 4000,
                visuals: [ranking],
                scenes: [
                  { id: 's1', visualId: ranking.id, title: 'Start', caption: 'Start', state: { time: 2025 } },
                  { id: 's2', visualId: ranking.id, title: 'End', caption: 'End', state: { time: 2026 } }
                ]
              });
              const player = new StoryPlayer(story, true);
              expect(player.getState().index).toBe(0);
              player.next();
              expect(player.getState().index).toBe(1);
              const host = document.createElement('div');
              const renderer = createRenderer(host);
              renderer.update(ranking, story.scenes[1], { width: 720, reducedMotion: true });
              expect(host.querySelector('figure.vf-figure')).not.toBeNull();
              expect(host.querySelectorAll('[data-entity-id]')).toHaveLength(2);
              renderer.destroy();
              expect(host.childElementCount).toBe(0);
              player.dispose();
            });

            it('keeps core and renderers independent of host frameworks', () => {
              for (const directory of ['src/core', 'src/renderers']) {
                for (const file of (readdirSync(directory, { recursive: true }) as string[]).filter((f) => f.endsWith('.ts'))) {
                  const path = `${directory}/${file}`;
                  const source = readFileSync(path, 'utf8');
                  expect(source).not.toMatch(/@datapass\//);
                  expect(source).not.toMatch(/from ['\"]react/);
                  for (const match of source.matchAll(/\b(?:from\s*|import\s*\(?\s*)['\"]([^'\"]+)['\"]/g)) {
                    const name = match[1];
                    if (!name.startsWith('.')) continue;
                    const target = resolve(dirname(path), name);
                    expect(
                      ['src/core', 'src/renderers'].some((root) => target.startsWith(resolve(root) + sep)),
                      target
                    ).toBe(true);
                  }
                }
              }
            });
          });
          TS

          cat > scripts/pack-smoke.mjs <<'JS'
          import { execFileSync } from 'node:child_process';
          import { existsSync, mkdtempSync, readFileSync, readdirSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const out = mkdtempSync(join(tmpdir(), 'vizforge-pack-'));
          execFileSync('pnpm', ['pack', '--pack-destination', out], { stdio: 'pipe' });
          const file = readdirSync(out).find((name) => name.endsWith('.tgz'));
          if (!file) throw new Error('pnpm pack did not create a tarball');
          const tarball = join(out, file);
          const listing = execFileSync('tar', ['-tzf', tarball], { encoding: 'utf8' });
          for (const required of [
            'package/dist/index.js',
            'package/dist/index.d.ts',
            'package/dist/adapters/react.js',
            'package/SOURCE_COMMIT'
          ]) {
            if (!listing.includes(required)) throw new Error(`Packed engine is missing ${required}`);
          }
          if (!existsSync('dist/index.js')) throw new Error('Library build did not emit dist/index.js');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.private !== true) throw new Error('Extraction checkpoint must remain private until release policy is explicit');
          console.log('pack smoke passed');
          JS

      - name: Prove byte-for-byte source parity
        shell: bash
        run: |
          set -euo pipefail
          diff -qr /tmp/viz-source/src/core src/core
          diff -qr /tmp/viz-source/src/renderers src/renderers
          diff -qr /tmp/viz-source/src/adapters src/adapters
          cmp /tmp/viz-source/src/index.ts src/index.ts

      - name: Install and run standalone gate
        run: |
          pnpm install --no-frozen-lockfile
          pnpm check

      - name: Record verified extraction
        shell: bash
        run: |
          cat > EXTRACTION_REPORT.md <<'EOF'
          # ForgeViz V1.2 extraction report

          Source consumer: `julian-passebecq/Fluent2_J_Viz`

          Source commit: `7aaa8fa601c5fa2c9f8acfd7a4d4eb54b887b9ef`

          `src/core`, `src/renderers`, `src/adapters`, and `src/index.ts` are copied byte-for-byte from the verified V1.2 source. No visual behavior or schema was redesigned during extraction.

          The standalone gate verifies exact source parity, framework-neutral core/renderers, TypeScript typecheck, independent parse/player/render smoke tests, typed ESM build, package tarball contents, and a generated pnpm lockfile. Consumers remain untouched.
          EOF

      - name: Commit only after a green gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src package.json pnpm-lock.yaml tsconfig.json tsconfig.lib.json vitest.config.ts tests scripts SOURCE_COMMIT EXTRACTION_REPORT.md
          if git diff --cached --quiet; then
            echo 'Verified extraction is already materialized.'
            exit 0
          fi
          git commit -m 'chore: materialize verified standalone ForgeViz V1.2 engine'
          git push origin HEAD:extract-v1.2-engine
