name: ForgeViz CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: '11.19.0'
          runtime: node@22.16.0
          install: false
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify standalone engine
        run: pnpm check
